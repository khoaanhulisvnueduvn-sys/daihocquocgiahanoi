<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quên mật khẩu</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="page-shell">
        <section class="login-card forgot-form-card" aria-labelledby="forgot-title">
            <h1 class="visually-hidden" id="forgot-title">Khôi phục mật khẩu</h1>

            <form method="POST" action="{{ url_for('forgot_password') }}">
                <div class="field-group forgot-email-group">
                    <label for="email">Nhập email của bạn</label>
                    <div class="input-row">
                        <span class="input-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" focusable="false">
                                <circle cx="12" cy="8" r="4"></circle>
                                <path d="M4.5 20c0-4.1 3.1-7 7.5-7s7.5 2.9 7.5 7z"></path>
                            </svg>
                        </span>
                        <input id="email" name="email" type="email" autocomplete="email" required>
                    </div>
                </div>

                <a class="back-to-login" href="{{ url_for('index') }}">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"></path>
                    </svg>
                    <span>Trở lại trang đăng nhập</span>
                </a>

                <button class="login-button forgot-submit" type="submit">Gửi đi</button>

                <p class="forgot-help"{% if submitted %} role="status"{% endif %}>
                    Nhập địa chỉ email của bạn và chúng tôi sẽ gửi cho bạn hướng dẫn về cách tạo mật khẩu mới.
                </p>
            </form>
        </section>
    </main>
</body>
</html>
