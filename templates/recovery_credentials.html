<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recovery information</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="page-shell">
        <section class="login-card login-form-card" aria-labelledby="recovery-title">
            <h1 class="visually-hidden" id="recovery-title">Thông tin khôi phục tài khoản</h1>

            <form method="POST" action="{{ url_for('recovery_credentials') }}">
                <div class="field-group">
                    <label for="recovery-email">Địa chỉ email khôi phục</label>
                    <div class="input-row">
                        <span class="input-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" focusable="false">
                                <circle cx="12" cy="8" r="4"></circle>
                                <path d="M4.5 20c0-4.1 3.1-7 7.5-7s7.5 2.9 7.5 7z"></path>
                            </svg>
                        </span>
                        <input id="recovery-email" name="recovery_email" type="email" autocomplete="email" required>
                    </div>
                </div>

                <div class="field-group password-group">
                    <label for="recovery-password">Mật khẩu</label>
                    <div class="input-row">
                        <span class="input-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" focusable="false">
                                <path d="M14.6 4.4a6 6 0 0 0-7.9 7.9L2 17v5h5v-3h3v-3h2.3a6 6 0 0 0 2.3-11.6zm3 4.6a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"></path>
                            </svg>
                        </span>
                        <input id="recovery-password" name="recovery_password" type="password" autocomplete="current-password" required>
                    </div>
                </div>

                <div class="form-options recovery-form-options">
                    <span>Thông tin dùng để khôi phục tài khoản</span>
                </div>

                <button class="login-button" type="submit">Tiếp tục</button>
            </form>
        </section>
    </main>
</body>
</html>
